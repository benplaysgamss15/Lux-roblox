<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Browserblox Tycoon</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevents zooming and scrolling on mobile */
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #top-bar {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
            color: white;
            text-shadow: 2px 2px 0px #000;
        }
        #cash-display {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }
        #instructions {
            font-size: 16px;
            text-align: right;
        }
        /* Mobile Joystick Visualization */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: none; /* Shown on touch */
        }
        #joystick-stick {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .desktop-hint { display: block; }
        @media (pointer: coarse) {
            .desktop-hint { display: none; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="top-bar">
            <div id="cash-display">Cash: $0</div>
            <div id="instructions">
                <b>Controls:</b><br>
                <span class="desktop-hint">Desktop: WASD to Move, Drag Mouse to Look<br></span>
                Mobile: Left half to Move, Right half to Look<br>
                <i>Step on buttons to buy upgrades!</i>
            </div>
        </div>
        <div id="joystick-base"><div id="joystick-stick"></div></div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. BASIC SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -30; dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30; dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        // Baseplate (Roblox style studs simulation)
        const baseGeo = new THREE.BoxGeometry(100, 1, 100);
        const baseMat = new THREE.MeshLambertMaterial({ color: 0x4a4a4a });
        const baseplate = new THREE.Mesh(baseGeo, baseMat);
        baseplate.position.y = -0.5;
        baseplate.receiveShadow = true;
        scene.add(baseplate);

        const gridHelper = new THREE.GridHelper(100, 50, 0x000000, 0x000000);
        gridHelper.position.y = 0.01;
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // --- 2. PLAYER (Roblox "Noob" Avatar) ---
        const player = new THREE.Group();
        player.position.set(0, 0, 15);
        scene.add(player);

        const matHead = new THREE.MeshLambertMaterial({ color: 0xf1c232 }); // Yellow
        const matTorso = new THREE.MeshLambertMaterial({ color: 0x1155cc }); // Blue
        const matLimbs = new THREE.MeshLambertMaterial({ color: 0x8fce00 }); // Green

        const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), matHead);
        head.position.y = 2.5; head.castShadow = true; player.add(head);

        const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), matTorso);
        torso.position.y = 1; torso.castShadow = true; player.add(torso);

        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2, 1), matHead);
        armL.position.set(-1.25, 1, 0); armL.castShadow = true; player.add(armL);

        const armR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2, 1), matHead);
        armR.position.set(1.25, 1, 0); armR.castShadow = true; player.add(armR);

        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), matLimbs);
        legL.position.set(-0.5, -1, 0); legL.castShadow = true; player.add(legL);

        const legR = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), matLimbs);
        legR.position.set(0.5, -1, 0); legR.castShadow = true; player.add(legR);

        // --- 3. CAMERA & CONTROLS ---
        let camAngle = Math.PI; // Orbit angle around Y axis
        let camPitch = Math.PI / 6; // Angle above player
        const camDistance = 10;

        // Input States
        const keys = { w: false, a: false, s: false, d: false };
        let joystickVector = { x: 0, y: 0 };
        
        // Touch State Separation
        let moveTouchId = null;
        let lookTouchId = null;
        let lastLookPos = { x: 0, y: 0 };
        let joystickStart = { x: 0, y: 0 };

        const joyBaseEl = document.getElementById('joystick-base');
        const joyStickEl = document.getElementById('joystick-stick');

        // Keyboard Controls
        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        // Touch Controls
        window.addEventListener('touchstart', (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if(touch.clientX < window.innerWidth / 2 && moveTouchId === null) {
                    // Left Side -> Move
                    moveTouchId = touch.identifier;
                    joystickStart = { x: touch.clientX, y: touch.clientY };
                    joyBaseEl.style.display = 'block';
                    joyBaseEl.style.left = (touch.clientX - 60) + 'px';
                    joyBaseEl.style.top = (touch.clientY - 60) + 'px';
                    joyStickEl.style.transform = `translate(-50%, -50%)`;
                } else if(touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
                    // Right Side -> Look
                    lookTouchId = touch.identifier;
                    lastLookPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if(touch.identifier === moveTouchId) {
                    // Update Joystick
                    let dx = touch.clientX - joystickStart.x;
                    let dy = touch.clientY - joystickStart.y;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    const maxRadius = 40;
                    if(distance > maxRadius) {
                        dx = (dx / distance) * maxRadius;
                        dy = (dy / distance) * maxRadius;
                    }
                    joyStickEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    
                    // Normalize for movement
                    joystickVector.x = dx / maxRadius;
                    joystickVector.y = dy / maxRadius;
                } else if(touch.identifier === lookTouchId) {
                    // Update Camera
                    const dx = touch.clientX - lastLookPos.x;
                    const dy = touch.clientY - lastLookPos.y;
                    camAngle -= dx * 0.005;
                    camPitch -= dy * 0.005;
                    // Clamp pitch so camera doesn't go under floor or over head
                    camPitch = Math.max(0.1, Math.min(Math.PI / 2.2, camPitch));
                    lastLookPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        });

        const endTouch = (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if(touch.identifier === moveTouchId) {
                    moveTouchId = null;
                    joystickVector = { x: 0, y: 0 };
                    joyBaseEl.style.display = 'none';
                } else if(touch.identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        };
        window.addEventListener('touchend', endTouch);
        window.addEventListener('touchcancel', endTouch);

        // Mouse Drag for Desktop Looking
        let isDragging = false;
        window.addEventListener('mousedown', (e) => { isDragging = true; lastLookPos = {x: e.clientX, y: e.clientY}; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if(isDragging) {
                camAngle -= (e.clientX - lastLookPos.x) * 0.005;
                camPitch -= (e.clientY - lastLookPos.y) * 0.005;
                camPitch = Math.max(0.1, Math.min(Math.PI / 2.2, camPitch));
                lastLookPos = { x: e.clientX, y: e.clientY };
            }
        });

        // --- 4. TYCOON MECHANICS ---
        let cash = 0;
        let dropValue = 5;
        let dropInterval = 2000;
        let lastDropTime = 0;
        
        const cashDisplay = document.getElementById('cash-display');
        const activeButtons = [];
        const activeDroppers =[];
        const droppedItems =[];
        let collectorZone = null;

        function updateCash(amt) {
            cash += amt;
            cashDisplay.innerText = `Cash: $${cash}`;
            cashDisplay.style.color = amt > 0 ? '#00FF00' : '#FF0000';
            setTimeout(() => { cashDisplay.style.color = '#4CAF50'; }, 300);
        }

        // Helper: Create 3D Text Sprite
        function createTextSprite(message, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 256;
            context.fillStyle = color;
            context.font = "Bold 40px 'Segoe UI'";
            context.textAlign = "center";
            context.fillText(message, 256, 128);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(6, 3, 1);
            return sprite;
        }

        // Tycoon Build Functions
        function createButton(x, z, text, cost, onBuy) {
            const btnColor = cost === 0 ? 0x00FF00 : 0xFF0000;
            const btnGroup = new THREE.Group();
            btnGroup.position.set(x, 0.1, z);

            const pad = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.2, 16), new THREE.MeshLambertMaterial({color: btnColor}));
            pad.castShadow = true; pad.receiveShadow = true;
            btnGroup.add(pad);

            const sprite = createTextSprite(`${text} ($${cost})`, cost === 0 ? '#00FF00' : '#FF0000');
            sprite.position.y = 2;
            btnGroup.add(sprite);

            scene.add(btnGroup);
            activeButtons.push({ group: btnGroup, cost: cost, action: onBuy });
        }

        function createDropper(x, y, z) {
            const dropperMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const dropper = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), dropperMat);
            dropper.position.set(x, y, z);
            dropper.castShadow = true;
            scene.add(dropper);
            
            // Conveyor visual
            const conv = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 8), new THREE.MeshLambertMaterial({color: 0x222222}));
            conv.position.set(x, 0.25, z + 4);
            scene.add(conv);

            activeDroppers.push({ x: x, y: y-1.5, z: z });
        }

        function createCollector(x, y, z) {
            const colMat = new THREE.MeshLambertMaterial({ color: 0x00FF00, emissive: 0x005500 });
            collectorZone = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 3), colMat);
            collectorZone.position.set(x, y, z);
            collectorZone.receiveShadow = true;
            scene.add(collectorZone);
        }

        function createWalls() {
            const wallMat = new THREE.MeshLambertMaterial({color: 0x3a86ff});
            const w1 = new THREE.Mesh(new THREE.BoxGeometry(20, 5, 1), wallMat);
            w1.position.set(0, 2.5, -10); scene.add(w1);
            const w2 = new THREE.Mesh(new THREE.BoxGeometry(1, 5, 20), wallMat);
            w2.position.set(-10, 2.5, 0); scene.add(w2);
            const w3 = new THREE.Mesh(new THREE.BoxGeometry(1, 5, 20), wallMat);
            w3.position.set(10, 2.5, 0); scene.add(w3);
        }

        // --- TYCOON PROGRESSION SCRIPT ---
        
        // Stage 1: The Start
        createButton(0, 5, "Claim Tycoon", 0, () => {
            createCollector(0, 0.25, -2);
            createDropper(0, 6, -8);
            // Spawn next button
            createButton(-5, 5, "Dropper 2", 50, () => {
                createDropper(-4, 6, -8);
                // Spawn next button
                createButton(5, 5, "Upgrade Value", 150, () => {
                    dropValue = 20;
                    // Spawn final button
                    createButton(0, 8, "Build Walls", 300, () => {
                        createWalls();
                    });
                });
            });
        });


        // --- 5. MAIN LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Movement Logic
            let moveZ = 0; let moveX = 0;
            const speed = 10 * delta;

            // Keyboard
            if (keys.w) moveZ -= 1;
            if (keys.s) moveZ += 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;

            // Touch Joystick
            if (moveTouchId !== null) {
                moveZ += joystickVector.y;
                moveX += joystickVector.x;
            }

            // Apply movement relative to camera angle
            if (moveX !== 0 || moveZ !== 0) {
                // Bobbing animation for player
                legL.rotation.x = Math.sin(time * 10) * 0.5;
                legR.rotation.x = Math.sin(time * 10 + Math.PI) * 0.5;
                armL.rotation.x = Math.sin(time * 10 + Math.PI) * 0.5;
                armR.rotation.x = Math.sin(time * 10) * 0.5;

                const dir = new THREE.Vector2(moveX, moveZ).normalize();
                
                // Calculate actual world direction based on camera orbit angle
                const walkAngle = Math.atan2(dir.y, dir.x) + camAngle + Math.PI/2;
                
                player.position.x += Math.cos(walkAngle) * speed * 1.5;
                player.position.z += Math.sin(walkAngle) * speed * 1.5;

                // Rotate player mesh to face movement direction
                player.rotation.y = -walkAngle + Math.PI/2;
            } else {
                // Reset limbs
                legL.rotation.x = 0; legR.rotation.x = 0;
                armL.rotation.x = 0; armR.rotation.x = 0;
            }

            // Camera Orbit Logic
            camera.position.x = player.position.x + camDistance * Math.cos(camPitch) * Math.sin(camAngle);
            camera.position.y = player.position.y + 3 + camDistance * Math.sin(camPitch);
            camera.position.z = player.position.z + camDistance * Math.cos(camPitch) * Math.cos(camAngle);
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

            // Tycoon Logic: Dropping Items
            if (Date.now() - lastDropTime > dropInterval) {
                activeDroppers.forEach(dropPos => {
                    const block = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({color: Math.random() * 0xffffff}));
                    block.position.set(dropPos.x, dropPos.y, dropPos.z);
                    block.castShadow = true;
                    scene.add(block);
                    droppedItems.push(block);
                });
                lastDropTime = Date.now();
            }

            // Tycoon Logic: Moving Items & Collecting
            for (let i = droppedItems.length - 1; i >= 0; i--) {
                const item = droppedItems[i];
                item.position.y -= 3 * delta; // Falling
                
                // Once it hits the conveyor, move it forward
                if (item.position.y <= 0.8) {
                    item.position.y = 0.8;
                    item.position.z += 4 * delta; 
                }

                // Check collision with collector
                if (collectorZone) {
                    const dist = item.position.distanceTo(collectorZone.position);
                    if (dist < 2.5) {
                        updateCash(dropValue);
                        scene.remove(item);
                        droppedItems.splice(i, 1);
                        continue;
                    }
                }

                // Despawn if it falls off map somehow
                if (item.position.y < -5 || item.position.z > 20) {
                    scene.remove(item);
                    droppedItems.splice(i, 1);
                }
            }

            // Tycoon Logic: Button Stepping
            for (let i = activeButtons.length - 1; i >= 0; i--) {
                const btn = activeButtons[i];
                // Check 2D distance (X, Z) to player
                const dx = player.position.x - btn.group.position.x;
                const dz = player.position.z - btn.group.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);

                if (dist < 1.5) {
                    if (cash >= btn.cost) {
                        updateCash(-btn.cost);
                        btn.action();
                        scene.remove(btn.group);
                        activeButtons.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
