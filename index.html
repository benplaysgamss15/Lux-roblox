<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ready or Not - Web FPS</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a; /* Darker atmosphere */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #top-bar {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            color: white;
            text-shadow: 1px 1px 0px #000;
        }
        #title-display {
            font-size: 24px;
            font-weight: bold;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #instructions {
            font-size: 14px;
            text-align: right;
            color: #ddd;
        }
        /* Tactical Crosshair */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 4px rgba(0,0,0,1);
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.6);
        }
        #crosshair::before { top: 50%; left: -10px; width: 24px; height: 2px; transform: translateY(-50%); }
        #crosshair::after { left: 50%; top: -10px; width: 2px; height: 24px; transform: translateX(-50%); }
        
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: none; 
        }
        #joystick-stick {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .desktop-hint { display: block; }
        @media (pointer: coarse) { .desktop-hint { display: none; } }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="top-bar">
            <div id="title-display">LSPD SWAT</div>
            <div id="instructions">
                <b>Controls:</b><br>
                <span class="desktop-hint">Desktop: WASD to Move, Drag Mouse to Look<br></span>
                Mobile: Left half to Move, Right half to Look
            </div>
        </div>
        <div id="crosshair"></div>
        <div id="joystick-base"><div id="joystick-stick"></div></div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. BASIC SETUP & ATMOSPHERE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x11141a); // Moody dark environment
        scene.fog = new THREE.FogExp2(0x11141a, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = "YXZ"; // CRITICAL for First Person Controls

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Tactical Lighting setup
        const hemiLight = new THREE.HemisphereLight(0x444455, 0x111122, 0.3);
        scene.add(hemiLight);

        const moonLight = new THREE.DirectionalLight(0x8899bb, 0.4);
        moonLight.position.set(30, 50, 30);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048; 
        moonLight.shadow.mapSize.height = 2048;
        moonLight.shadow.camera.left = -50; moonLight.shadow.camera.right = 50;
        moonLight.shadow.camera.top = 50; moonLight.shadow.camera.bottom = -50;
        scene.add(moonLight);

        // Grid Baseplate (Concrete look)
        function createGridTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a2a2a'; ctx.fillRect(0,0,128,128);
            ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
            ctx.strokeRect(0,0,128,128);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(50, 50);
            return tex;
        }

        const baseGeo = new THREE.PlaneGeometry(200, 200);
        const baseMat = new THREE.MeshStandardMaterial({ map: createGridTexture(), roughness: 0.9 });
        const baseplate = new THREE.Mesh(baseGeo, baseMat);
        baseplate.rotation.x = -Math.PI / 2;
        baseplate.receiveShadow = true;
        scene.add(baseplate);

        // --- 2. PLAYER & WEAPON SYSTEM ---
        const player = new THREE.Group();
        player.position.set(0, 0, 0); 
        scene.add(player);
        scene.add(camera); // Add camera to scene so child objects render correctly

        // Tactical Flashlight attached to camera
        const flashlight = new THREE.SpotLight(0xffffff, 2, 40, Math.PI / 6, 0.5, 1);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -1);
        flashlight.castShadow = true;
        camera.add(flashlight);
        camera.add(flashlight.target);

        // --- TACTICAL RIFLE MODEL ---
        const gunGroup = new THREE.Group();
        
        // Receiver / Body
        const matGunBody = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7, metalness: 0.4 });
        const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.5), matGunBody);
        receiver.position.set(0, 0, 0);
        gunGroup.add(receiver);

        // Barrel
        const matBarrel = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5, metalness: 0.8 });
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.4, 8), matBarrel);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0.02, -0.4);
        gunGroup.add(barrel);

        // Magazine
        const mag = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.12), matGunBody);
        mag.position.set(0, -0.15, -0.1);
        mag.rotation.x = 0.1;
        gunGroup.add(mag);

        // Sight / Optic
        const sight = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.1), matGunBody);
        sight.position.set(0, 0.1, 0.05);
        gunGroup.add(sight);

        // Position gun relative to the camera view (FPS Viewmodel)
        gunGroup.position.set(0.3, -0.3, -0.6);
        camera.add(gunGroup);

        // --- 3. CONTROLS (Kept exactly from your code, adjusted for FPS) ---
        let camAngle = 0;   // Yaw
        let camPitch = 0;   // Pitch
        
        const keys = { w: false, a: false, s: false, d: false };
        let joystickVector = { x: 0, y: 0 };
        
        let moveTouchId = null;
        let lookTouchId = null;
        let lastLookPos = { x: 0, y: 0 };
        let joystickStart = { x: 0, y: 0 };

        const joyBaseEl = document.getElementById('joystick-base');
        const joyStickEl = document.getElementById('joystick-stick');

        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        window.addEventListener('touchstart', (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if(touch.clientX < window.innerWidth / 2 && moveTouchId === null) {
                    moveTouchId = touch.identifier;
                    joystickStart = { x: touch.clientX, y: touch.clientY };
                    joyBaseEl.style.display = 'block';
                    joyBaseEl.style.left = (touch.clientX - 60) + 'px';
                    joyBaseEl.style.top = (touch.clientY - 60) + 'px';
                    joyStickEl.style.transform = `translate(-50%, -50%)`;
                } else if(touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
                    lookTouchId = touch.identifier;
                    lastLookPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if(touch.identifier === moveTouchId) {
                    let dx = touch.clientX - joystickStart.x;
                    let dy = touch.clientY - joystickStart.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const maxRadius = 40;
                    if(dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
                    joyStickEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    joystickVector.x = dx / maxRadius;
                    joystickVector.y = dy / maxRadius;
                } else if(touch.identifier === lookTouchId) {
                    const dx = touch.clientX - lastLookPos.x;
                    const dy = touch.clientY - lastLookPos.y;
                    camAngle -= dx * 0.005;
                    camPitch -= dy * 0.005;
                    // Clamped pitch so you can't break your neck backwards
                    camPitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, camPitch));
                    lastLookPos = { x: touch.clientX, y: touch.clientY };
                }
            }
        });

        const endTouch = (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if(touch.identifier === moveTouchId) {
                    moveTouchId = null; joystickVector = { x: 0, y: 0 }; joyBaseEl.style.display = 'none';
                } else if(touch.identifier === lookTouchId) { lookTouchId = null; }
            }
        };
        window.addEventListener('touchend', endTouch);
        window.addEventListener('touchcancel', endTouch);

        // Desktop Mouse Drag to Look
        let isDragging = false;
        window.addEventListener('mousedown', (e) => { isDragging = true; lastLookPos = {x: e.clientX, y: e.clientY}; });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if(isDragging) {
                camAngle -= (e.clientX - lastLookPos.x) * 0.005;
                camPitch -= (e.clientY - lastLookPos.y) * 0.005;
                camPitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, camPitch));
                lastLookPos = { x: e.clientX, y: e.clientY };
            }
        });

        // Add some random test blocks so we can see we are moving in 3D space
        const boxGeo = new THREE.BoxGeometry(2, 2, 2);
        const boxMat = new THREE.MeshStandardMaterial({color: 0x883333});
        for(let i=0; i<20; i++){
            const mesh = new THREE.Mesh(boxGeo, boxMat);
            mesh.position.set((Math.random() - 0.5) * 60, 1, (Math.random() - 0.5) * 60);
            mesh.castShadow = true; mesh.receiveShadow = true;
            scene.add(mesh);
        }

        // --- 4. MAIN LOOP ---
        const clock = new THREE.Clock();
        let bobTime = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Movement Logic
            let moveZ = 0; let moveX = 0;
            const speed = 8 * delta; // Tactical walking speed

            if (keys.w) moveZ -= 1;
            if (keys.s) moveZ += 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;
            if (moveTouchId !== null) { moveZ += joystickVector.y; moveX += joystickVector.x; }

            let isMoving = false;

            if (moveX !== 0 || moveZ !== 0) {
                isMoving = true;
                const cameraDir = new THREE.Vector3();
                camera.getWorldDirection(cameraDir);
                cameraDir.y = 0; cameraDir.normalize();

                const cameraRight = new THREE.Vector3();
                cameraRight.crossVectors(cameraDir, camera.up).normalize();

                const moveVec = new THREE.Vector3();
                moveVec.addScaledVector(cameraDir, -moveZ); 
                moveVec.addScaledVector(cameraRight, moveX); 

                if (moveVec.lengthSq() > 0) {
                    moveVec.normalize();
                    const inputMagnitude = Math.min(1, Math.sqrt(moveX * moveX + moveZ * moveZ));
                    player.position.addScaledVector(moveVec, speed * inputMagnitude);
                }
            }

            // Weapon Bobbing Effect when walking
            if(isMoving) {
                bobTime += delta * 12;
                gunGroup.position.y = -0.3 + Math.sin(bobTime) * 0.015;
                gunGroup.position.x = 0.3 + Math.cos(bobTime * 0.5) * 0.015;
            } else {
                // Smoothly return gun to center when stopped
                gunGroup.position.y += (-0.3 - gunGroup.position.y) * 10 * delta;
                gunGroup.position.x += (0.3 - gunGroup.position.x) * 10 * delta;
            }

            // Lock Camera to Player Position & Apply Rotations (First Person)
            camera.position.set(player.position.x, player.position.y + 1.7, player.position.z); // Eye height
            camera.rotation.set(camPitch, camAngle, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
